<header class="sticky top-0 z-50 bg-slate-950/85 backdrop-blur-xl border-b border-slate-800/80 shadow-2xl shadow-black/50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-20">
      
      <!-- LOGO & BRAND -->
      <div class="flex items-center gap-8">
        <a routerLink="/dashboard" class="flex items-center gap-3 group">
          <!-- Logo Icon with Gradient & Ring Glow -->
          <div class="relative w-10 h-10 rounded-xl bg-gradient-to-tr from-orange-600 via-amber-500 to-orange-400 flex items-center justify-center text-white shadow-lg shadow-orange-500/25 group-hover:shadow-orange-500/40 group-hover:scale-105 transition-all duration-300 ring-1 ring-white/20">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 fill-current drop-shadow-md" viewBox="0 0 24 24">
              <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
            </svg>
          </div>
          <!-- Brand Text -->
          <span class="text-2xl font-black tracking-tight text-white uppercase group-hover:text-slate-100 transition-colors">
            TIFFIN <span class="text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-amber-400">FLOW</span>
          </span>
        </a>

        <!-- LOCATION SELECTOR -->
        <!-- <button 
          (click)="toggleLocationDropdown()"
          class="hidden lg:flex items-center gap-2 text-xs font-semibold bg-slate-900/90 text-slate-300 border border-slate-800 py-2 px-3.5 rounded-full hover:bg-slate-800 hover:border-orange-500/40 hover:text-orange-400 transition-all duration-300 group">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-orange-500 group-hover:scale-110 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span class="truncate max-w-[140px] tracking-wide">{{ deliveryLocation() }}</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5 text-slate-500 group-hover:text-orange-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </button> -->
      </div>

      <!-- DESKTOP NAVIGATION -->
      <nav class="hidden md:flex items-center gap-1 lg:gap-2">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path" 
             routerLinkActive="text-orange-400 bg-orange-500/10 font-semibold border-orange-500/30"
             [routerLinkActiveOptions]="{exact: link.path === '/'}"
             class="px-4 py-2 rounded-xl text-sm font-medium text-slate-300 border border-transparent hover:text-orange-400 hover:bg-slate-900 hover:border-slate-800 transition-all duration-200">
            {{ link.label }}
          </a>
        }
      </nav>

      <!-- RIGHT ACTIONS -->
      <div class="flex items-center gap-3">
        
        <!-- Search Button -->
        <!-- <button aria-label="Search" class="p-2.5 text-slate-400 hover:text-orange-400 hover:bg-slate-900 border border-transparent hover:border-slate-800 rounded-full transition-all duration-200">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </button> -->

        <!-- Cart Button -->
        <a routerLink="/cart" class="relative p-2.5 bg-slate-900 border border-slate-800 hover:border-orange-500/40 text-slate-300 hover:text-orange-400 rounded-full transition-all duration-300 flex items-center justify-center group">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 group-hover:scale-105 transition-transform" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/>
          </svg>
          @if (cartCount() > 0) {
            <span class="absolute -top-1 -right-1 bg-gradient-to-r from-orange-600 to-amber-500 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-950 shadow-md shadow-orange-500/30 animate-pulse">
              {{ cartCount() }}
            </span>
          }
        </a>

        <!-- Primary CTA: Sign In -->
        <a routerLink="/auth" class="hidden sm:inline-flex items-center justify-center px-5 py-2.5 rounded-full bg-gradient-to-r from-orange-600 to-amber-600 hover:from-orange-500 hover:to-amber-500 text-white text-sm font-bold shadow-lg shadow-orange-600/20 hover:shadow-orange-500/35 hover:scale-[1.02] active:scale-95 transition-all duration-200 border border-orange-400/20">
          Sign In
        </a>

        <!-- Hamburger Button -->
        <button (click)="toggleMobileMenu()" aria-label="Toggle menu" class="md:hidden p-2.5 text-slate-300 hover:text-orange-400 hover:bg-slate-900 border border-transparent hover:border-slate-800 rounded-xl transition-all">
          @if (!isMobileMenuOpen()) {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          }
        </button>
      </div>

    </div>
  </div>

  <!-- MOBILE MENU DRAWER -->
  @if (isMobileMenuOpen()) {
    <div class="md:hidden border-t border-slate-800/80 bg-slate-950/95 backdrop-blur-2xl px-4 pt-4 pb-6 space-y-4 shadow-2xl">
      <!-- Mobile Location Selector -->
      <div class="flex items-center justify-between p-3.5 bg-slate-900/90 border border-slate-800/80 rounded-xl text-xs font-semibold text-slate-300">
        <div class="flex items-center gap-2.5">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-orange-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          </svg>
          <span>Deliver to: <strong class="text-white font-medium">{{ deliveryLocation() }}</strong></span>
        </div>
        <span class="text-orange-400 text-xs font-bold hover:underline cursor-pointer">Change</span>
      </div>

      <!-- Links -->
      <div class="flex flex-col space-y-1.5">
        @for (link of navLinks; track link.path) {
          <a [routerLink]="link.path" 
             (click)="closeMobileMenu()"
             routerLinkActive="bg-orange-500/10 text-orange-400 font-bold border-l-2 border-orange-500"
             [routerLinkActiveOptions]="{exact: link.path === '/'}"
             class="px-4 py-3 rounded-lg text-base font-medium text-slate-300 hover:bg-slate-900 hover:text-orange-400 transition-all">
            {{ link.label }}
          </a>
        }
      </div>

      <!-- Mobile CTA -->
      <div class="pt-2">
        <a routerLink="/auth" (click)="closeMobileMenu()" class="w-full flex items-center justify-center py-3.5 rounded-xl bg-gradient-to-r from-orange-600 to-amber-600 text-white font-bold text-center shadow-lg shadow-orange-600/25 active:scale-[0.98] transition-all">
          Sign In or Register
        </a>
      </div>
    </div>
  }
</header>
